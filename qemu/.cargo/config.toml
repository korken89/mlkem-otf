[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Built by `make test-qemu`, see icount.c
runner = "qemu-system-arm -machine mps2-an505 -cpu cortex-m33 -nographic -semihosting-config enable=on,target=native -plugin target/libicount.so -kernel"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=cortex-m33"]
